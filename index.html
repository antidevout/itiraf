
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İtiraf | İçinde Tutma</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101010;color:#f5f5f5;
 font-family:Arial,sans-serif;
}
header{
 padding:25px 7%;border-bottom:1px solid #292929;
 display:flex;justify-content:space-between;
}
.logo{font-size:25px;font-weight:bold}
main{max-width:700px;margin:65px auto;padding:20px}
h1{font-size:42px;margin-bottom:12px}
p{color:#999;line-height:1.6}
form{
 background:#191919;border:1px solid #303030;
 padding:20px;border-radius:14px;margin-top:35px;
}
textarea{
 width:100%;height:150px;padding:15px;
 background:#101010;color:white;
 border:1px solid #333;border-radius:9px;
 resize:vertical;font-size:16px;
}
button{
 width:100%;padding:15px;margin-top:15px;
 background:white;color:black;border:0;
 border-radius:9px;font-weight:bold;font-size:15px;
}
h2{margin-top:55px}
.card{
 background:#191919;padding:20px;
 border:1px solid #303030;
 border-radius:12px;margin-top:15px;
}
small{color:#777}
footer{text-align:center;color:#777;padding:40px}
</style>
</head>
<body>
<header>
 <div class="logo">itiraf.</div>
 <div>Anonim platform</div>
</header>
<main>
 <h1>İçinde tutma.</h1>
 <p>Kimseye anlatamadığın şeyleri burada
 anonim olarak paylaşabilirsin.</p>

 <form id="form">
  <textarea id="content"
   minlength="10" maxlength="2000"
   placeholder="İtirafını buraya yaz..."
   required></textarea>
  <button type="submit">Anonim itiraf gönder</button>
  <p id="message" aria-live="polite"></p>
 </form>

 <h2>Son itiraflar</h2>
 <div id="feed">
  <div class="card">
   <p>Burada anonim itiraflar yer alacak.</p>
   <small>İtiraf platformu</small>
  </div>
 </div>
</main>
<footer>itiraf. · Herkesin anlatacak bir hikâyesi var.</footer>
<script>
document.getElementById("form").addEventListener("submit",e=>{
 e.preventDefault();
 document.getElementById("message").textContent=
 "Gönderim sistemi henüz kurulmadı. Çok yakında!";
});
</script>
</body>
</html>
